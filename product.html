<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koma Product</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="product-page">

    <img
        id="productImage"
        src="assets/spirit-tee.png"
        alt="Product"
        class="product-page-image">

    <h1 id="productName">Loading...</h1>

    <p id="productCategory"></p>

    <h2 id="productPrice"></h2>

    <p class="product-description">
Premium oversized cotton tee featuring the Spirit artwork.<br><br>

• 240 GSM Cotton<br>
• Oversized Fit<br>
• DTF Print<br>
• Unisex
</p>

<p class="size-label">Select Size</p>

    <div class="sizes">
    <button class="size-btn">S</button>
    <button class="size-btn">M</button>
    <button class="size-btn">L</button>
    <button class="size-btn">XL</button>
</div>

    <button id="productAddCart">
        Add To Cart
    </button>

</div>

<script>
function goBack(){
    window.location.href = "index.html";
}
</script>

<script src="product.js"></script>

<button class="close-product" onclick="goBack()">
    ✕
</button>
<div id="cartToast" class="cart-toast">
    Added to cart ✅
</div>
</body>
</html>
